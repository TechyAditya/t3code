name: iOS Sideload IPA

# Builds an unsigned Personal Team variant of the mobile app from upstream
# pingdotgg/t3code and publishes it as a GitHub release. Sideloading tools
# (AltStore, SideStore, Sideloadly) sign it with the installer's Apple ID.
# Personal Team builds omit the widget/share extensions, push, App Groups and
# native Sign in with Apple, none of which a free Apple ID can sign.
#
# Hourly runs mirror upstream into this fork's main branch and build the newest
# upstream release (nightlies included) unless it already has an IPA release.
# This workflow lives on the fork's default branch rather than main because the
# Actions token cannot push upstream workflow changes onto a diverged branch.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Branch, tag or commit of pingdotgg/t3code (empty = newest release)
        required: false
        default: ""
      bundle_id:
        description: Bundle identifier (sideloading tools may rewrite it)
        required: true
        default: com.techyaditya.t3code
      t3_connect:
        description: Enable T3 Connect using the public identifiers from .env.example
        type: boolean
        default: true
      force:
        description: Rebuild even if a release for this upstream tag exists
        type: boolean
        default: false

concurrency:
  group: ios-sideload-ipa
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM: pingdotgg/t3code

jobs:
  resolve:
    name: Sync fork and resolve upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      ref: ${{ steps.resolve.outputs.ref }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
    steps:
      - name: Sync main with upstream
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main

      - id: resolve
        name: Resolve release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            ref="$INPUT_REF"
            if gh release view "$ref" -R "$UPSTREAM" >/dev/null 2>&1; then
              upstream_tag="$ref"
            else
              upstream_tag=""
            fi
          else
            upstream_tag="$(gh release list -R "$UPSTREAM" -L 1 --exclude-drafts --json tagName --jq '.[0].tagName')"
            ref="$upstream_tag"
          fi

          build=true
          if [ -n "$upstream_tag" ] && [ "$FORCE" != "true" ] \
            && gh release view "ios-$upstream_tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
            echo "ios-$upstream_tag already published; nothing to build."
          fi

          echo "Upstream ref: $ref (release tag: ${upstream_tag:-none}), build: $build"
          {
            echo "build=$build"
            echo "ref=$ref"
            echo "upstream_tag=$upstream_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build unsigned IPA
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      T3CODE_IOS_PERSONAL_TEAM: "1"
      T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: ${{ inputs.bundle_id || 'com.techyaditya.t3code' }}
      # Production OTA updates target store binaries and could replace this
      # build's bundle with one speaking an older protocol.
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.resolve.outputs.ref }}
          path: t3code
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: t3code
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...

      - name: Enable T3 Connect
        if: github.event_name == 'schedule' || inputs.t3_connect
        working-directory: t3code
        run: cp .env.example .env

      - name: Prebuild iOS project
        working-directory: t3code/apps/mobile
        run: vp exec expo prebuild --clean --platform ios

      - name: Build Release app
        working-directory: t3code/apps/mobile
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/T3Code.xcworkspace \
            -scheme T3Code \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || status=$?
          grep -E "error:|\*\* BUILD" "$RUNNER_TEMP/xcodebuild.log" || true
          exit "${status:-0}"

      - name: Package IPA
        id: package
        env:
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
        run: |
          app="$RUNNER_TEMP/derived-data/Build/Products/Release-iphoneos/T3Code.app"
          test -x "$app/T3Code"
          sha="$(git -C t3code rev-parse --short=12 HEAD)"
          if [ -n "$UPSTREAM_TAG" ]; then
            label="${UPSTREAM_TAG#v}"
            tag="ios-$UPSTREAM_TAG"
          else
            label="$(date -u +%Y%m%d%H%M)-$sha"
            tag="ios-$label"
          fi
          work="$RUNNER_TEMP/ipa"
          mkdir -p "$work/Payload"
          cp -R "$app" "$work/Payload/"
          ipa="T3-Code-iOS-$label-unsigned.ipa"
          (cd "$work" && zip -qry "$GITHUB_WORKSPACE/$ipa" Payload)
          ls -lh "$ipa"
          {
            echo "ipa=$ipa"
            echo "label=$label"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "full_sha=$(git -C t3code rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IPA: ${{ steps.package.outputs.ipa }}
          TAG: ${{ steps.package.outputs.tag }}
          LABEL: ${{ steps.package.outputs.label }}
          SHA: ${{ steps.package.outputs.sha }}
          FULL_SHA: ${{ steps.package.outputs.full_sha }}
          REF: ${{ needs.resolve.outputs.ref }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
        run: |
          if [ -n "$UPSTREAM_TAG" ]; then
            source_line="Upstream release: [$UPSTREAM_TAG](https://github.com/$UPSTREAM/releases/tag/$UPSTREAM_TAG) ([\`$SHA\`](https://github.com/$UPSTREAM/commit/$FULL_SHA))"
          else
            source_line="Source: [\`$SHA\`](https://github.com/$UPSTREAM/commit/$FULL_SHA) (\`$REF\`)"
          fi
          cat > notes.md <<EOF
          Unsigned sideload build of T3 Code Mobile.

          - $source_line
          - Bundle ID: \`$T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID\`
          - Personal Team variant: no widgets, share extension, push notifications or native Sign in with Apple. OTA updates disabled.

          Install with AltStore, SideStore or Sideloadly, which sign the IPA with your Apple ID.
          EOF
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "$IPA" \
            --target "$GITHUB_SHA" \
            --title "T3 Code iOS $LABEL" \
            --notes-file notes.md \
            --latest
